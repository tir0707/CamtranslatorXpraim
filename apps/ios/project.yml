name: CamtranslatorXpraim
options:
  bundleIdPrefix: org.camtranslatorxpraim
  deploymentTarget:
    iOS: '18.0'
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
targets:
  CamtranslatorXpraim:
    type: application
    platform: iOS
    sources:
      - PhoneCam
      - Camera
      - Streaming
      - Audio
      - Networking
      - UI
      - Settings
    dependencies:
      - package: WebRTC
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: CamtranslatorXpraim
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSCameraUsageDescription: Камера используется для локальной трансляции на ваш компьютер.
        NSMicrophoneUsageDescription: Микрофон используется для передачи звука на ваш компьютер по вашему выбору.
        NSLocalNetworkUsageDescription: Поиск компьютера и передача видео в вашей локальной сети.
        NSBonjourServices: ['_camxp._tcp']
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.camtranslatorxpraim.ios
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
schemes:
  CamtranslatorXpraim:
    build:
      targets:
        CamtranslatorXpraim: all

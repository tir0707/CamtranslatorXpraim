<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>CamtranslatorXpraim — iPhone</title></head><body>
<header><b>CamtranslatorXpraim</b><span id="status">Не подключено</span></header>
<main><video id="video" autoplay playsinline muted></video><p id="metrics">Ожидание камеры</p>
<label>Код с компьютера <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000"></label>
<div class="row"><button id="connect">Подключить камеру</button><button id="stop" disabled>Остановить</button></div>
<label>Качество <select id="quality"><option value="640,480,30,900000">480p · 30 FPS</option><option value="1280,720,30,2500000" selected>720p · 30 FPS</option><option value="1920,1080,30,5000000">1080p · 30 FPS</option><option value="1280,720,60,4000000">720p · 60 FPS</option><option value="1920,1080,60,8000000">1080p · 60 FPS</option></select></label>
<div class="row"><button id="flip">Сменить камеру</button><label><input id="mic" type="checkbox"> Микрофон</label><label><input id="mirror" type="checkbox"> Зеркало</label></div>
<p>Трансляция работает, пока Safari открыт и экран разблокирован. Реальное разрешение показано выше. Режимы камеры Safari определяет при запросе; неподдерживаемые настройки отклоняются.</p><p id="error" role="alert"></p></main><script type="module" src="sender.js"></script></body></html>
